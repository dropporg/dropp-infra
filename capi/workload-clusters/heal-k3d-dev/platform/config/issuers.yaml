---
# Self-signed root, used only to issue the cluster CA below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# The cluster CA. Trusting this one certificate makes every hostname under
# the cluster's domain verify, with no per-service exceptions.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: heal-k3d-dev-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: heal-k3d-dev-ca
  secretName: heal-k3d-dev-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# What application Certificates actually reference.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: heal-ca
spec:
  ca:
    secretName: heal-k3d-dev-ca
