apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.19.6"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  # Reverts hand edits to the release on the next reconcile.
  driftDetection:
    mode: enabled
  values:
    # cert-manager does not install its own CRDs unless asked, and without them
    # no Certificate or Issuer ever reconciles.
    crds:
      enabled: true
    # One replica each. On a 2-worker cluster the default of 2 webhook replicas
    # cannot satisfy its own anti-affinity, so a pod stays Pending.
    replicaCount: 1
    webhook:
      replicaCount: 1
    cainjector:
      replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
