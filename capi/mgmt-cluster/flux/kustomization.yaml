apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Flux's own installation. Applied once by install-flux.sh, then owned by Git.
  - flux-system/
  # The CAPI cluster definitions, and the CNI their nodes need to go Ready.
  - clusters-kustomization.yaml
  - addons-kustomization.yaml
  # Installs Flux into each workload cluster.
  - heal-dev-cluster-bootstrap-kustomization.yaml
  # Enrolled only when heal-k3d-prod is; see capi/clusters/local/kustomization.yaml.
  # - heal-prod-cluster-bootstrap-kustomization.yaml
